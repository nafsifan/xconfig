#  @ConfigName        Nafsi.xConfig for Windows (FlClash / Mihomo)
#  @Author           @Nafsi
#  @UpdateTime       2026/11/02 17:50 UTC/GMT +8
#  @ConfigVersion     1.0.0
#  @ConfigURL         https://github.com/nafsifan/xconfig

---
# 基础设置
mixed-port: 7890
allow-lan: false
mode: Rule
log-level: warning
external-controller: '127.0.0.1:9090'
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 60

# Geo 数据库
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: >-
    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: >-
    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: >-
    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: >-
    https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

# 状态持久化
profile:
  store-selected: true
  tracing: true

# 本地 DNS 映射
hosts: {}

# 域名嗅探
sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain:
    - '+.apple.com'
    - '+.icloud.com'
    - '+.wechat.com'
    - '+.qq.com'
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.steamcontent.com'
    - '+.steamchina.com'

# TUN 模式
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - 'any:53'

# 订阅源
proxy-providers: {}

# DNS 设置
dns:
  enable: true
  listen: '0.0.0.0:53'
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 默认 DNS
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  # 节点解析 DNS
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # Fake-IP 白名单
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.icloud.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - '+.steamcontent.com'
    - '+.steamchina.com'
    - '+.dl.steam.clngaa.com'
    - '+.dl.steam.ksyna.com'
    - '+.wmsjsteam.com'

  # 域名指定 DNS
  nameserver-policy:
    '+.steamcontent.com': [119.29.29.29, 223.5.5.5]
    '+.steamchina.com': [119.29.29.29, 223.5.5.5]
    '+.wmsjsteam.com': [119.29.29.29, 223.5.5.5]
    'csgo.wmsj.cn': [119.29.29.29, 223.5.5.5]
    'dota2.wmsj.cn': [119.29.29.29, 223.5.5.5]
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

  # 代理 DNS
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

# 节点
proxies: []

# 策略组
proxy-groups:
  # 节点选择
  - name: 节点选择
    type: select
    proxies:
      - DIRECT
      - Hong Kong
      - Japan
      - United States
      - Singapore
      - Other Regions
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png

  # 香港
  - name: Hong Kong
    type: select
    include-all: true
    filter: '(?i)(🇭🇰|香港|(\b(HK|HKG|Hong\s*Kong)\b))'
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png

  # 日本
  - name: Japan
    type: select
    include-all: true
    filter: '(?i)(🇯🇵|日本|(\b(JP|JPN|Japan)\b))'
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png

  # 美国
  - name: United States
    type: select
    include-all: true
    filter: '(?i)(🇺🇸|美国|(\b(US|USA|United\s*States|America)\b))'
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png

  # 新加坡
  - name: Singapore
    type: select
    include-all: true
    filter: '(?i)(🇸🇬|新加坡|狮城|(\b(SG|SGP|Singapore)\b))'
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png

  # 其他地区
  - name: Other Regions
    type: select
    include-all: true
    filter: '.*'
    exclude-filter: "(?i)(🇭🇰|🇯🇵|🇸🇬|🇺🇸|香港|日本|新加坡|狮城|美国|\\
      \\b(HK|HKG|Hong\\s*Kong|JP|JPN|Japan|SG|SGP|Singapore|US|USA|United\\s*States|America)\\b)"
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  # 富途牛牛
  - name: 富途牛牛
    type: select
    proxies: &G
      - DIRECT
      - 节点选择
      - Hong Kong
      - Japan
      - United States
      - Singapore
      - Other Regions
    icon: >-
      https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Pig.png

  # 苹果服务
  - name: 苹果服务
    type: select
    proxies: *G
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_1.png

  # 游戏平台
  - name: 游戏平台
    type: select
    proxies: *G
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  # 微软服务
  - name: 微软服务
    type: select
    proxies: *G
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png

  # Telegram
  - name: Telegram
    type: select
    proxies: *G
    icon: >-
      https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png

# 规则
rules:
  # 局域网直连
  - GEOIP,LAN,DIRECT,no-resolve

  # 广告拦截
  - RULE-SET,Advertising,REJECT

  # Steam 下载
  - RULE-SET,SteamCN,DIRECT

  # 富途牛牛
  - RULE-SET,Moomoo,富途牛牛

  # AI相关
  - RULE-SET,AI,United States

  # Google Voice
  - RULE-SET,GoogleVoice,United States

  # Apple 服务
  - RULE-SET,AppleCN,DIRECT
  - RULE-SET,AppleID,苹果服务
  - RULE-SET,Apple,苹果服务

  # 游戏平台
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Epic,游戏平台

  # 微软服务
  - RULE-SET,Microsoft,微软服务

  # Telegram
  - RULE-SET,Telegram,Telegram

  # 海外代理
  - RULE-SET,Global,节点选择

  # 国内流量
  - RULE-SET,China,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 兜底
  - MATCH,节点选择

# 远程规则
rule-providers:
  China:
    type: http
    behavior: classical
    format: yaml
    url: https://rule.kelee.one/Clash/ChinaMax.yaml
    path: ./Rules/Direct.yaml
    interval: 86400

  Global:
    type: http
    behavior: classical
    format: yaml
    url: https://rule.kelee.one/Clash/Global.yaml
    path: ./Rules/Global.yaml
    interval: 86400

  AppleCN:
    type: http
    behavior: classical
    format: text
    url: >-
      https://testingcf.jsdelivr.net/gh/Repcz/Tool@X/mihomo/Rules/AppleCN.list
    path: ./Rules/AppleCN.list
    interval: 86400

  AppleID:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/AppleID.yaml'
    path: ./Rules/AppleID.yaml
    interval: 86400

  Apple:
    type: http
    behavior: classical
    format: yaml
    url: https://rule.kelee.one/Clash/Apple.yaml
    path: ./Rules/Apple.yaml
    interval: 86400

  Microsoft:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/Microsoft.yaml'
    path: ./Rules/Microsoft.yaml
    interval: 604800

  Advertising:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/Advertising.yaml'
    path: ./Rules/Advertising.yaml
    interval: 604800

  SteamCN:
    type: http
    behavior: classical
    format: yaml
    url: https://rule.kelee.one/Clash/SteamCN.yaml
    path: ./Rules/SteamCN.yaml
    interval: 86400

  Steam:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/Steam.yaml'
    path: ./Rules/Steam.yaml
    interval: 604800

  Epic:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/Epic.yaml'
    path: ./Rules/Epic.yaml
    interval: 604800

  Telegram:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/Telegram.yaml'
    path: ./Rules/Telegram.yaml
    interval: 604800

  GoogleVoice:
    type: http
    behavior: classical
    format: yaml
    url: 'https://rule.kelee.one/Clash/GoogleVoice.yaml'
    path: ./Rules/GoogleVoice.yaml
    interval: 604800

  AI:
    type: http
    behavior: classical
    format: yaml
    url: >-
      https://testingcf.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/global.yaml
    path: ./Rules/AI.yaml
    interval: 86400

  # 富途牛牛
  Moomoo:
    type: http
    behavior: classical
    format: text
    url: >-
      https://raw.githubusercontent.com/nafsifan/xconfig/main/rules/Finance/Moomoo.list
    path: ./rules/Moomoo.list
    interval: 86400
